# After the Rain 0.2 - shader settings for Iris / OptiFine-style packs
screen = <profile> [GROUND] [REFLECTIONS] [ATMOSPHERE] [SKY]
screen.GROUND = WET_DARKNESS PUDDLE_AMOUNT PUDDLE_SIZE GRASS_PUDDLES
screen.REFLECTIONS = REFLECTION_QUALITY REFLECTION_INTENSITY RAIN_RIPPLES
screen.ATMOSPHERE = RAIN_FOG FOG_AMOUNT RAIN_COLOR_GRADE
screen.SKY = STORM_SKY STORM_CLOUD_COVER STORM_SKY_DARKNESS RAIN_CLOUD_TINT
sliders = WET_DARKNESS PUDDLE_AMOUNT PUDDLE_SIZE GRASS_PUDDLES REFLECTION_INTENSITY FOG_AMOUNT STORM_CLOUD_COVER STORM_SKY_DARKNESS
profile.FAST = WET_DARKNESS:0.64 PUDDLE_AMOUNT:0.70 PUDDLE_SIZE:0.54 GRASS_PUDDLES:0.50 REFLECTION_QUALITY:0 !RAIN_RIPPLES FOG_AMOUNT:0.50 STORM_CLOUD_COVER:0.65 STORM_SKY_DARKNESS:0.40
profile.BALANCED = WET_DARKNESS:0.64 PUDDLE_AMOUNT:0.85 PUDDLE_SIZE:0.54 GRASS_PUDDLES:0.80 REFLECTION_QUALITY:2 RAIN_RIPPLES FOG_AMOUNT:0.78 STORM_CLOUD_COVER:0.78 STORM_SKY_DARKNESS:0.60
profile.CINEMATIC = WET_DARKNESS:0.56 PUDDLE_AMOUNT:1.00 PUDDLE_SIZE:0.60 GRASS_PUDDLES:1.00 REFLECTION_QUALITY:3 RAIN_RIPPLES FOG_AMOUNT:1.00 STORM_CLOUD_COVER:0.90 STORM_SKY_DARKNESS:0.80

# Keep vanilla cloud geometry, weather and sun/moon rendering.
clouds = off
sun = true
moon = true
stars = true
weather = true

# Custom metadata must not be blended with transparent terrain material.
blend.gbuffers_terrain.colortex2 = off
blend.gbuffers_terrain.colortex3 = off
