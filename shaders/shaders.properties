# After the Rain 0.1 - shader settings for Iris / OptiFine-style packs
screen = <profile> [GROUND] [REFLECTIONS] [ATMOSPHERE]
screen.GROUND = WET_DARKNESS PUDDLE_AMOUNT PUDDLE_SIZE
screen.REFLECTIONS = REFLECTION_QUALITY REFLECTION_INTENSITY RAIN_RIPPLES
screen.ATMOSPHERE = RAIN_FOG FOG_AMOUNT RAIN_COLOR_GRADE
sliders = WET_DARKNESS PUDDLE_AMOUNT PUDDLE_SIZE REFLECTION_INTENSITY FOG_AMOUNT
profile.FAST = WET_DARKNESS:0.64 PUDDLE_AMOUNT:0.70 PUDDLE_SIZE:0.54 REFLECTION_QUALITY:0 !RAIN_RIPPLES FOG_AMOUNT:0.50
profile.BALANCED = WET_DARKNESS:0.64 PUDDLE_AMOUNT:0.85 PUDDLE_SIZE:0.54 REFLECTION_QUALITY:2 RAIN_RIPPLES FOG_AMOUNT:0.78
profile.CINEMATIC = WET_DARKNESS:0.56 PUDDLE_AMOUNT:1.00 PUDDLE_SIZE:0.60 REFLECTION_QUALITY:3 RAIN_RIPPLES FOG_AMOUNT:1.00

# Preserve vanilla cloud, weather and sun/moon rendering.
clouds = fancy
sun = true
moon = true
stars = true
weather = true

# Custom metadata must not be blended with transparent terrain material.
blend.gbuffers_terrain.colortex2 = off
blend.gbuffers_terrain.colortex3 = off
