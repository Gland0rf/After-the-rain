# After the Rain - Storm Edition (Iris / OptiFine-style shaderpack)
# Options are defined in their respective GLSL shader programs.
screen = <profile> [RAIN] [GROUND] [REFLECTIONS] [ATMOSPHERE] [CAMERA]
screen.RAIN = RAIN_DETAIL RAIN_DENSITY RAIN_STREAK_BRIGHTNESS RAIN_WIND SILVER_RAIN RAIN_SPLASHES RAIN_SHADER_DEBUG
screen.GROUND = WET_DARKNESS PUDDLE_AMOUNT PUDDLE_SIZE GRASS_PUDDLES
screen.REFLECTIONS = REFLECTION_QUALITY REFLECTION_INTENSITY RAIN_RIPPLES
screen.ATMOSPHERE = STORM_SKY STORM_CLOUDS STORM_CLOUD_COVER STORM_SKY_DARKNESS STORM_CLOUD_WIND RAIN_FOG FOG_AMOUNT RAIN_COLOR_GRADE
screen.CAMERA = STORM_GLOW STORM_VIGNETTE LENS_DROPLETS
sliders = RAIN_DENSITY RAIN_STREAK_BRIGHTNESS RAIN_WIND WET_DARKNESS PUDDLE_AMOUNT PUDDLE_SIZE GRASS_PUDDLES REFLECTION_INTENSITY FOG_AMOUNT

profile.FAST = RAIN_DETAIL:0 RAIN_DENSITY:0.75 RAIN_STREAK_BRIGHTNESS:0.60 RAIN_WIND:0.20 !RAIN_SPLASHES REFLECTION_QUALITY:0 !RAIN_RIPPLES !STORM_GLOW !LENS_DROPLETS STORM_CLOUD_COVER:0.72 STORM_SKY_DARKNESS:0.50 STORM_CLOUD_WIND:0.25 FOG_AMOUNT:0.50
profile.BALANCED = RAIN_DETAIL:0 RAIN_DENSITY:0.75 RAIN_STREAK_BRIGHTNESS:0.80 RAIN_WIND:0.35 RAIN_SPLASHES REFLECTION_QUALITY:2 RAIN_RIPPLES STORM_GLOW !LENS_DROPLETS STORM_CLOUD_COVER:0.82 STORM_SKY_DARKNESS:0.72 STORM_CLOUD_WIND:0.45 FOG_AMOUNT:0.78
profile.CINEMATIC = RAIN_DETAIL:1 RAIN_DENSITY:1.25 RAIN_STREAK_BRIGHTNESS:1.00 RAIN_WIND:0.60 RAIN_SPLASHES REFLECTION_QUALITY:3 RAIN_RIPPLES STORM_GLOW LENS_DROPLETS STORM_CLOUD_COVER:0.92 STORM_SKY_DARKNESS:0.88 STORM_CLOUD_WIND:0.70 FOG_AMOUNT:1.00

clouds = off
sun = true
moon = true
stars = true
weather = true

# Metadata buffers must not alpha blend with pre-existing transparent terrain.
blend.gbuffers_terrain.colortex2 = off
blend.gbuffers_terrain.colortex3 = off
