# After the Rain - Storm Edition (Iris / OptiFine-style shaderpack)
# Shared options are defined in lib/settings.glsl.
screen = <profile> [RAIN] [GROUND] [REFLECTIONS] [ATMOSPHERE] [WEATHER_DETAILS] [CAMERA] WEATHER_DEBUG
screen.RAIN = RAIN_DETAIL RAIN_DENSITY RAIN_STREAK_BRIGHTNESS RAIN_WIND WIND_GUSTS FOLIAGE_WIND SILVER_RAIN RAIN_SPLASHES RAIN_SHADER_DEBUG
screen.GROUND = WET_DARKNESS PUDDLE_AMOUNT PUDDLE_SIZE GRASS_PUDDLES WETTING_TIME DRYING_TIME RAIN_SHELTER MATERIAL_WET_PATTERNS WALL_RUNOFF ROOF_DRIPS POOLING_QUALITY WET_ENTITIES DRYING_EDGES WET_FOLIAGE
screen.REFLECTIONS = REFLECTION_QUALITY REFLECTION_INTENSITY MATERIAL_ROUGHNESS RAIN_RIPPLES WATER_RIPPLES SHORE_DETAIL
screen.ATMOSPHERE = STORM_SKY STORM_CLOUDS SKY_QUALITY STORM_CLOUD_COVER STORM_SKY_DARKNESS STORM_CLOUD_WIND THUNDER_ATMOSPHERE LIGHTNING_RESPONSE CLEARING_SKY AFTER_RAIN_RAINBOW RAIN_FOG FOG_AMOUNT MIST_HEIGHT RAIN_COLOR_GRADE
screen.CAMERA = STORM_GLOW STORM_VIGNETTE LENS_DROPLETS LENS_DROPLET_AMOUNT
screen.WEATHER_DETAILS = LAMPLIT_RAIN LAMPLIGHT_INTENSITY DISTANT_RAIN RAIN_CURTAIN_AMOUNT SUN_SHAFTS SUN_SHAFT_STRENGTH ATMOSPHERE_QUALITY BIOME_WEATHER
sliders = RAIN_DENSITY RAIN_STREAK_BRIGHTNESS RAIN_WIND WET_DARKNESS PUDDLE_AMOUNT PUDDLE_SIZE GRASS_PUDDLES REFLECTION_INTENSITY FOG_AMOUNT MIST_HEIGHT LIGHTNING_RESPONSE LAMPLIGHT_INTENSITY RAIN_CURTAIN_AMOUNT SUN_SHAFT_STRENGTH LENS_DROPLET_AMOUNT

profile.FAST = DRYING_EDGES !WET_FOLIAGE !SHORE_DETAIL WEATHER_DEBUG:0 LAMPLIT_RAIN LAMPLIGHT_INTENSITY:0.35 !DISTANT_RAIN !SUN_SHAFTS ATMOSPHERE_QUALITY:0 BIOME_WEATHER WET_ENTITIES POOLING_QUALITY:0 MATERIAL_WET_PATTERNS !WALL_RUNOFF ROOF_DRIPS:0 CLEARING_SKY !AFTER_RAIN_RAINBOW LIGHTNING_RESPONSE:0.20 !RAIN_SHELTER !MATERIAL_ROUGHNESS !WATER_RIPPLES !FOLIAGE_WIND WIND_GUSTS SKY_QUALITY:0 RAIN_DETAIL:0 RAIN_DENSITY:0.75 RAIN_STREAK_BRIGHTNESS:0.60 RAIN_WIND:0.20 !RAIN_SPLASHES REFLECTION_QUALITY:0 !RAIN_RIPPLES !STORM_GLOW !LENS_DROPLETS STORM_CLOUD_COVER:0.72 STORM_SKY_DARKNESS:0.50 STORM_CLOUD_WIND:0.25 FOG_AMOUNT:0.50
profile.BALANCED = DRYING_EDGES WET_FOLIAGE SHORE_DETAIL WEATHER_DEBUG:0 LAMPLIT_RAIN LAMPLIGHT_INTENSITY:0.65 DISTANT_RAIN RAIN_CURTAIN_AMOUNT:0.55 SUN_SHAFTS SUN_SHAFT_STRENGTH:0.35 ATMOSPHERE_QUALITY:1 BIOME_WEATHER WET_ENTITIES POOLING_QUALITY:1 MATERIAL_WET_PATTERNS WALL_RUNOFF ROOF_DRIPS:1 CLEARING_SKY !AFTER_RAIN_RAINBOW LIGHTNING_RESPONSE:0.35 RAIN_SHELTER MATERIAL_ROUGHNESS WATER_RIPPLES FOLIAGE_WIND WIND_GUSTS SKY_QUALITY:1 RAIN_DETAIL:0 RAIN_DENSITY:0.75 RAIN_STREAK_BRIGHTNESS:0.80 RAIN_WIND:0.35 RAIN_SPLASHES REFLECTION_QUALITY:2 RAIN_RIPPLES STORM_GLOW !LENS_DROPLETS STORM_CLOUD_COVER:0.82 STORM_SKY_DARKNESS:0.72 STORM_CLOUD_WIND:0.45 FOG_AMOUNT:0.78
profile.CINEMATIC = DRYING_EDGES WET_FOLIAGE SHORE_DETAIL WEATHER_DEBUG:0 LAMPLIT_RAIN LAMPLIGHT_INTENSITY:1.00 DISTANT_RAIN RAIN_CURTAIN_AMOUNT:0.85 SUN_SHAFTS SUN_SHAFT_STRENGTH:0.35 ATMOSPHERE_QUALITY:2 BIOME_WEATHER WET_ENTITIES POOLING_QUALITY:2 MATERIAL_WET_PATTERNS WALL_RUNOFF ROOF_DRIPS:2 CLEARING_SKY AFTER_RAIN_RAINBOW LIGHTNING_RESPONSE:0.35 RAIN_SHELTER MATERIAL_ROUGHNESS WATER_RIPPLES FOLIAGE_WIND WIND_GUSTS SKY_QUALITY:2 RAIN_DETAIL:1 RAIN_DENSITY:1.25 RAIN_STREAK_BRIGHTNESS:1.00 RAIN_WIND:0.60 RAIN_SPLASHES REFLECTION_QUALITY:3 RAIN_RIPPLES STORM_GLOW LENS_DROPLETS STORM_CLOUD_COVER:0.92 STORM_SKY_DARKNESS:0.88 STORM_CLOUD_WIND:0.70 FOG_AMOUNT:1.00

clouds = off
sun = true
moon = true
stars = true
weather = true

# Metadata buffers must not alpha blend with pre-existing transparent terrain.
blend.gbuffers_terrain.colortex2 = off
blend.gbuffers_terrain.colortex3 = off

# smooth() fade durations are half-lives in ticks. Four seconds at 20 TPS.
# Camera-biome approximation; blend instead of switching every pixel abruptly.
uniform.float.atrRainClimate = smooth(71, if(biome_precipitation == 1, 1.0, 0.0), 80.0, 80.0)

# Vertical rain-exposure map, not sunlight shadows. Disable sun-frustum culling.
program.shadow.enabled = RAIN_SHELTER
shadow.culling = false
shadowTerrain = true
shadowTranslucent = true
shadowEntities = false
shadowPlayer = false
shadowBlockEntities = true
blend.shadow = off

# Shared, short lightning response for sky, reflected sky, wet terrain and mist.
uniform.float.atrLightningFlash = smooth(72, lightningBoltPosition.w, 0.25, 2.0)

# Blend camera-biome properties across borders before they influence weather.
uniform.float.atrBiomeHumidity = smooth(73, clamp(rainfall, 0.0, 1.0), 160.0, 160.0)
uniform.float.atrBiomeTemperature = smooth(74, temperature, 160.0, 160.0)

# The temporary shaft target is only written by composite1, then upsampled by
# composite2. No geometry pass writes to this reduced-resolution buffer.
size.buffer.colortex5 = 0.5 0.5
program.composite1.enabled = SUN_SHAFTS
program.composite2.enabled = SUN_SHAFTS
